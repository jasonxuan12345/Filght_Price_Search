<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flight Value Advisor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="toolbar">
        <div>
          <h1>厦门 ⇄ 伦敦航班比价</h1>
          <p>选择航司后自动遍历所有日期，获取实时价格并按从低到高排序</p>
        </div>
        <button id="run">查询航班</button>
      </section>

      <section class="controls">
        <label>出发地 
          <input id="origin" value="XMN" />
        </label>
        <label>目的地 
          <input id="destination" value="LON" />
        </label>
        <label>航司选择 
          <select id="airlineId">
            <option value="all">全部航司</option>
            <option value="cz">中国南方航空</option>
            <option value="ca">中国国航</option>
            <option value="mu">中国东方航空</option>
            <option value="hu">海南航空</option>
            <option value="3u">四川航空</option>
            <option value="mf">厦门航空</option>
            <option value="zh">深圳航空</option>
          </select>
        </label>
        <label>出发开始 
          <input id="outboundStart" type="date" value="2026-05-20" />
        </label>
        <label>出发结束 
          <input id="outboundEnd" type="date" value="2026-06-08" />
        </label>
        <label>旅行天数 
          <input id="nights" type="number" min="3" max="30" value="7" />
        </label>
      </section>

      <section class="status" id="status">准备就绪 — 点击「查询航班」获取实时价格</section>

      <section class="panel">
        <h2>航班结果 <span class="result-count" id="resultCount"></span></h2>
        <div id="results" class="results-list"></div>
      </section>

      <section class="panel">
        <h2>使用说明</h2>
        <ul>
          <li>选择航司后，系统自动遍历日期范围内的<strong>所有日期</strong></li>
          <li>有 SERPAPI_KEY 时自动获取 Google Flights <strong>实时价格</strong>并排序</li>
          <li>无 API Key 时显示参考航班组合 + 查价链接</li>
          <li>免费注册 SerpApi 账号即可自动获取实时价格：<a href="https://serpapi.com/" target="_blank" rel="noreferrer">serpapi.com</a></li>
        </ul>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
